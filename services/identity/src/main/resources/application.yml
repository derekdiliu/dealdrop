server:
  port: ${PORT:8081}

spring:
  application:
    name: identity
  config:
    # Local secrets live in the repository root's .env (git-ignored). Both paths are listed so it is
    # found whether the service starts from the repository root or from its module directory (IDE default).
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${DB_USERNAME:dealdrop}
    password: ${DB_PASSWORD:dealdrop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

dealdrop:
  admin:
    # When both are set, an admin account with these credentials is created on startup if missing.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    issuer: ${JWT_ISSUER:dealdrop-identity}
    # Short-lived: the frontend swaps its refresh token for a new pair when this runs out.
    ttl: ${JWT_TTL:PT15M}
    # Signing key pair as PEM resources, e.g. DEALDROP_JWT_PRIVATEKEY=file:/run/secrets/jwt-private.pem
    # and DEALDROP_JWT_PUBLICKEY=file:/run/secrets/jwt-public.pem. When unset, an ephemeral key pair
    # is generated at startup, so issued tokens do not survive a restart.
  refresh-token:
    # Each use issues a new token valid for this long, so customers stay signed in while they keep visiting.
    ttl: P30D
    # A token used again within this window is the browser sending several requests at once, not theft.
    reuse-grace: PT30S

management:
  endpoints:
    web:
      exposure:
        include: health,info
