server:
  port: ${PORT:8080}

dealdrop:
  services:
    identity-url: ${IDENTITY_URL:http://localhost:8081}
    catalog-url: ${CATALOG_URL:http://localhost:8082}

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity
              uri: ${dealdrop.services.identity-url}
              predicates:
                - Path=/api/identity/**
            - id: catalog
              uri: ${dealdrop.services.catalog-url}
              predicates:
                - Path=/api/catalog/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${dealdrop.services.identity-url}/.well-known/jwks.json
          # Checked against the token's "iss" claim; must match identity's dealdrop.jwt.issuer.
          issuer-uri: ${JWT_ISSUER:dealdrop-identity}

management:
  endpoints:
    web:
      exposure:
        include: health,info
